name: Bug Report
description: File a bug report
labels:
- "issue: bug report"
body:
- type: markdown
  attributes:
    value: Thanks for the report!
- type: textarea
  id: describe-bug
  attributes:
    label: Describe the bug
    description: |
      A clear and concise description of the bug.
  validations:
    required: true
- type: textarea
  id: steps-to-reproduce
  attributes:
    label: Steps to reproduce
    description: |
      Add context about the problem here. Describe how it happened and how to reproduce it.
  validations:
    required: true
- type: dropdown
  id: version
  attributes:
    label: Version
    description: |
      Select the app version in which the bug appears.
    options:
    - (not specified)
    - 1.0.0
  validations:
    required: true
- type: dropdown
  id: platform
  attributes:
    label: Platform
    description: |
      Select the platform on which the bug appears.
    options:
    - (not specified)
    - Android
    - Desktop
    - iOS
    - Web
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Your Environment
    description: |
      Describe the environment in which the bug appeared (operating system, device, ...).
  validations:
    required: false
- type: upload
  id: upload-files
  attributes:
    label: Upload relevant files
    description: |
      Drag and drop any relevant screenshots or log files here.
  validations:
    required: false
    accept: ".png,.jpg,.gif,.log,.txt,.zip"
- type: textarea
  id: additional-information
  attributes:
    label: Additional information
    description: |
      Add any additional information about the bug report here.
  validations:
    required: false
