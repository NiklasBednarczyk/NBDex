name: Feature request
description: File a feature request
labels:
- "issue: feature request"
body:
- type: markdown
  attributes:
    value: |
      Thanks for the idea!
- type: textarea
  id: describe-problem
  attributes:
    label: Describe the problem
    description: |
      Is your feature request related to a specific problem? If so, please describe it.
  validations:
    required: true
- type: textarea
  id: describe-solution
  attributes:
    label: Describe the solution
    description: |
      Please describe the solution you would like. Provide a clear and concise description of what you want to happen.
  validations:
    required: true
- type: textarea
  id: additional-information
  attributes:
    label: Additional information
    description: |
      Add any additional information about the feature request here.
  validations:
    required: false
