name: job-setup
description: Checkout and setup Java and Gradle
runs:
  using: composite
  steps:
  - name: Checkout
    uses: actions/checkout@v5
  - name: Setup Java
    uses: actions/setup-java@v5.0.0
    with:
      java-version: 17
      distribution: temurin
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v5.0.0
